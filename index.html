            function dateCard(n) {

            function windowsCard() {

                }

            function viewLearn() {
                return '<section class="card"><p class="eyebrow">Safer sex guide</p><h1 class="hl-left">Higher and lower chance days</h1>' +
                    '<p>Petal shows when pregnancy is more or less likely. These are estimates, so a condom or another method is still the safest choice. Only condoms also protect against STIs.</p></section>' +
                    '<section class="card"><h2>Check any date</h2><div class="field"><label for="chk">Pick a date</label><input type="date" id="chk" value="' + keyOf(TODAY) + '"></div><div id="chk-out">' + dateCard(TODAY) + '</div></section>' +
                    '<section class="card"><h2>Your next windows</h2>' + windowsCard() + '</section>' +
                    '<section class="card" style="gap:0">' +
                    '<details><summary>How the fertile window works</summary><div class="body"><p>Ovulation usually happens about 12 to 16 days before your next period starts. The egg lives for about a day. Sperm can live up to 5 days inside the body.</p><p>That is why the days before ovulation count too. The fertile window is about 6 days long. Petal marks it from 5 days before the estimated ovulation day to 1 day after.</p></div></details>' +
                    '<details><summary>Why tracking alone can fail</summary><div class="body"><p>Ovulation can move because of stress, illness, travel, poor sleep or stopping hormonal birth control. Teens and people with irregular cycles are more likely to ovulate at unexpected times.</p><p>Methods that rely on counting days alone fail for roughly 2 to 23 in 100 people each year, according to the US CDC. They work best together with a condom or another method.</p></div></details>' +
                    '<details><summary>Condoms and STIs</summary><div class="body"><p>Cycle tracking does not protect against STIs. A condom used correctly every time lowers the chance of both pregnancy and most STIs.</p><ul><li>Check the expiry date.</li><li>Use a new one each time, and never two at once.</li><li>Regular STI testing is normal and nothing to be embarrassed about.</li><li>Vaccines for HPV and hepatitis B add protection.</li></ul></div></details>' +
                    '<details><summary>If a condom breaks or you had sex without protection</summary><div class="body"><p>Emergency contraception lowers the chance of pregnancy, and it works better the sooner you use it. Pills are best within 3 days, and some types work up to 5 days. A copper IUD fitted by a clinician within 5 days is the most effective option.</p><p>A pharmacist or clinic can help you choose. Take a pregnancy test if your period is more than a week late, and think about STI testing too.</p></div></details>' +
                    '<details><summary>Consent and feeling ready</summary><div class="body"><p>You decide what happens with your body. Saying yes once does not mean yes every time, and you can stop at any point.</p><p>Being ready means feeling safe, not pressured, and able to talk about protection. If something happened that you did not want, you can tell a trusted adult or a health worker. It is not your fault.</p></div></details>' +
                    '<details><summary>When to see a doctor</summary><div class="body"><ul><li>No period for 3 months or more, and you are not pregnant.</li><li>Cycles often shorter than 21 days or longer than 45 days.</li><li>Bleeding for more than 7 days.</li><li>Soaking through a pad or tampon every hour for several hours.</li><li>Pain strong enough to stop your normal day.</li><li>Bleeding between periods or after sex.</li></ul></div></details>' +
                    '</section>' +
                    '<p class="fine">Petal gives general information and estimates. It is not medical advice and it is not birth control.</p>';
            }

            function chartSVG() {
                var g = A.gaps.map(function(len, i) {
                    return {
                        len: len,
                        start: A.runs[i].start
                    }
                }).slice(-8);
                if (!g.length) return '<p class="muted">Log at least two periods to see your cycle lengths here.</p>';
                var W = 320,
                    H = 176,
                    l = 26,
                    r = 6,
                    t = 16,
                    b = 26,
                    pw = W - l - r,
                    ph = H - t - b;
                var maxY = Math.ceil((Math.max(35, Math.max.apply(null, g.map(function(x) {
                    return x.len
                }))) + 3) / 14) * 14;

                function y(v) {
                    return t + ph - (v / maxY) * ph
                }
                var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Bar chart of your last ' + g.length + ' cycle lengths in days">';
                out += '<rect class="band" x="' + l + '" y="' + y(35).toFixed(1) + '" width="' + pw + '" height="' + (y(21) - y(35)).toFixed(1) + '"/>';
                for (var v = 0; v <= maxY; v += 14) {
                    out += '<line class="axis" x1="' + l + '" x2="' + (W - r) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text class="tick" x="' + (l - 5) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + v + '</text>'
                }
                var slot = pw / g.length,
                    bw = Math.min(28, slot * .6);
                g.forEach(function(x, i) {
                    var bx = l + slot * i + (slot - bw) / 2,
                        odd = x.len < 18 || x.len > 60;
                    out += '<rect class="bar' + (odd ? ' odd' : '') + '" x="' + bx.toFixed(1) + '" y="' + y(x.len).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (y(0) - y(x.len)).toFixed(1) + '" rx="5"/>' +
                        '<text class="val" x="' + (bx + bw / 2).toFixed(1) + '" y="' + (y(x.len) - 4).toFixed(1) + '">' + x.len + '</text>' +
                        '<text class="xl" x="' + (bx + bw / 2).toFixed(1) + '" y="' + (H - 8) + '">' + short(x.start) + '</text>';
                });
                if (A.mean) out += '<line class="avg" x1="' + l + '" x2="' + (W - r) + '" y1="' + y(A.mean).toFixed(1) + '" y2="' + y(A.mean).toFixed(1) + '"/>';
                return out + '</svg>';
            }

            function viewInsights() {
                var opts = function(a, b, sel) {
                    var s = '';

                var erase = eraseAsk ?

                    '<div class="two"><button class="btn ghost" data-act="copy">Copy my data</button><button class="btn ghost" data-act="erase">Erase my data</button></div>';
                return '<section class="card"><p class="eyebrow">Your pattern</p><div class="stats">' +

                    '<div id="copy-area"></div>' + (CLOUD ? '<button class="btn ghost block" data-act="acct">' + (user ? 'Manage my account' : 'Sign in to back up and sync') + '</button>' : '') + erase + '</section>';
            }

            function setupHTML(fromDemo) {
                var opts = function(a, b, sel) {

                    '<div class="field"><label for="su-date">First day of your last period</label><input type="date" id="su-date" max="' + keyOf(TODAY) + '"></div>' +
                    '<div class="field"><label for="su-date2">First day of the period before that (optional)</label><input type="date" id="su-date2" max="' + keyOf(TODAY) + '"><p class="hint">Adding this lets Petal measure one full cycle right away.</p></div>' +
                    '<div class="two"><div class="field"><label for="su-p">Period lasts</label><select id="su-p">' + opts(2, 10, 5) + '</select></div><div class="field"><label for="su-c">Cycle usually</label><select id="su-c">' + opts(21, 45, 28) + '</select></div></div>' +

            function saveSetup() {
                var v = $('#su-date').value,
                    v2 = $('#su-date2').value,
                    P = +$('#su-p').value,
                    C = +$('#su-c').value,
                    err = $('#su-err');
                if (!v) {
                    err.textContent = 'Pick the first day of your last period.';
                    return
                }
                var a = fromKey(v);
                if (a > TODAY) {
                    err.textContent = 'That date is in the future.';
                    return
                }
                var period = [];

                function add(s) {
                    for (var d = 0; d < P; d++) {
                        if (s + d <= TODAY) period.push(s + d)
                    }
                }
                add(a);
                if (v2) {
                    var b = fromKey(v2);
                    if (a - b < 18) {
                        err.textContent = 'The earlier period should start at least 18 days before your last one.';
                        return
                    }
                    if (a - b > 60) {
                        err.textContent = 'The earlier period should start no more than 60 days before your last one.';
                        return
                    }
                    add(b);
                }

                    period: period.sort(function(x, y) {
                        return x - y
                    }),
                    log: {},
                    cycleLen: C,
                    periodLen: P,
                    demo: false,
                    syncUser: S.syncUser
                };

                closeSheet();
                tab = 'today';
                animate = true;
                renderAll();

            /* ---------- actions ---------- */
            function ensureReal() {
                if (S.demo) {
                    openSheet({
                        t: 'setup',
                        demo: true
                    });

                }

            }

            function setPeriod(n, on) {
                if (!ensureReal()) return false;
                var i = S.period.indexOf(n);
                if (on && i < 0) S.period.push(n);
                if (!on && i >= 0) S.period.splice(i, 1);
                S.period.sort(function(a, b) {
                    return a - b
                });
                persist();
                return true;
            }

            function fillRun(n) {
                if (!ensureReal()) return;
                compute();
                for (var d = 0; d < A.P; d++) {

                }

                    return a - b
                });
                persist();
                renderAll();

            }

                }

                return {
                    period: [],
                    log: {},
                    cycleLen: 28,
                    periodLen: 5,
                    demo: false,
                    updatedAt: 0
                }
            }

            function syncText() {
                return {
                    off: 'Not signed in',
                    pulling: 'Loading your data...',
                    saving: 'Saving to your account...',
                    ok: 'Backed up and synced',
                    err: 'Could not reach the server. Petal will retry.'
                }[syncState] || ''
            }

            function setSync(st) {
                syncState = st;
                var dot = $('#acct-dot');
                if (dot) dot.className = 'dot' + (st === 'ok' ? ' ok' : (st === 'saving' || st === 'pulling') ? ' busy' : st === 'err' ? ' err' : '');
                var line = $('#sync-line');
                if (line) line.textContent = syncText();
            }

            function refreshSheet() {
                if (sheetKind && sheetKind.t === 'acct') panel.innerHTML = acctHTML()
            }

            function acctHTML() {
                var head = '<div class="sheet-head"><div><p class="eyebrow">Backup and sync</p><h2>Your account</h2></div><button class="icon-btn" data-act="close" aria-label="Close">' + XICON + '</button></div>';
                if (user) {
                    if (acctConfirm) return head + '<p class="callout warn">This deletes the copy of your data stored in your account and signs you out. Your data stays on this device.</p><div class="two"><button class="btn ghost" data-act="cloud-delete-no">Keep it</button><button class="btn warn" data-act="cloud-delete-yes">Delete cloud data</button></div>';
                    return head + '<p>Signed in as <strong>' + esc(user.email || 'your account') + '</strong></p>' +
                        '<p><span class="pill"><i></i><span id="sync-line">' + syncText() + '</span></span></p>' +
                        '<p class="muted">Your data is stored in your account so you can open Petal on any device. Each account can only read its own data.</p>' +
                        '<button class="btn ghost block" data-act="sync-now">Sync now</button>' +
                        '<button class="btn ghost block" data-act="signout">Sign out</button>' +
                        '<button class="btn ghost block" data-act="signout-wipe">Sign out and remove data from this device</button>' +
                        '<button class="btn warn block" data-act="cloud-delete">Delete my cloud data</button>';
                }
                if (linkSent) return head + '<p class="callout">We sent a sign-in link to <strong>' + esc(linkSent) + '</strong>. Open it on this device to finish signing in. It can take a minute, so check your spam folder too.</p>';
                return head + '<p>Sign in to back up your data and use Petal on more than one device. It is optional.</p>' +
                    '<div class="field"><label for="acct-email">Email</label><input type="email" id="acct-email" autocomplete="email" inputmode="email" placeholder="you@example.com"></div>' +
                    '<label class="check"><input type="checkbox" id="acct-consent"><span>I understand my period data will be stored on a server and linked to my email. I can delete it at any time.</span></label>' +
                    '<p class="err" id="acct-err" role="alert"></p>' +
                    '<button class="btn primary" data-act="send-link">Email me a sign-in link</button>' +
                    '<p class="hint">No password needed.</p>';
            }

            function sendLink() {
                var email = ($('#acct-email').value || '').trim(),
                    err = $('#acct-err');
                if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
                    err.textContent = 'Enter a valid email address.';
                    return
                }
                if (!$('#acct-consent').checked) {
                    err.textContent = 'Tick the box to continue.';
                    return
                }
                err.textContent = '';
                var opts = {};
                if (location.protocol === 'http:' || location.protocol === 'https:') opts.emailRedirectTo = location.origin + location.pathname;
                sb.auth.signInWithOtp({
                    email: email,
                    options: opts
                }).then(function(r) {
                    if (r.error) {
                        err.textContent = r.error.message;
                        return
                    }
                    linkSent = email;
                    refreshSheet();
                }, function() {
                    err.textContent = 'Could not reach the server. Check your connection and try again.'
                });
            }

            function signOut(wipe) {
                sb.auth.signOut().then(function() {
                    user = null;
                    setSync('off');
                    if (wipe) {
                        try {
                            localStorage.removeItem(KEY)
                        } catch (e) {}
                        S = demo()
                    }
                    closeSheet();
                    renderAll();
                    toast(wipe ? 'Signed out and cleared this device' : 'Signed out');
                });
            }

            function deleteCloud() {
                if (!user) return;
                sb.from('cycle_data').delete().eq('user_id', user.id).then(function(r) {
                    if (r.error) {
                        toast('Could not delete. Try again.');
                        return
                    }
                    delete S.syncUser;
                    if (!S.demo) writeStore();
                    acctConfirm = false;
                    return sb.auth.signOut().then(function() {
                        user = null;
                        setSync('off');
                        closeSheet();
                        renderAll();
                        toast('Cloud data deleted')
                    });
                }, function() {
                    toast('Could not reach the server.')
                });
            }

            function exportState() {
                return {
                    period: S.period,
                    log: S.log,
                    cycleLen: S.cycleLen,
                    periodLen: S.periodLen
                }
            }

            function hasData() {
                return !S.demo && (S.period.length > 0 || Object.keys(S.log).length > 0)
            }

            function schedulePush() {
                if (!sb || !user) return;
                pending = true;
                clearTimeout(pushTimer);
                setSync('saving');
                pushTimer = setTimeout(push, 900);
            }

            function push() {
                pending = false;
                if (!sb || !user || S.demo) return Promise.resolve();
                var stamp = S.updatedAt || Date.now();
                return sb.from('cycle_data').upsert({
                    user_id: user.id,
                    data: exportState(),
                    updated_at: new Date(stamp).toISOString()
                }).then(function(r) {
                    if (r.error) {
                        setSync('err');
                        return
                    }
                    S.syncUser = user.id;
                    writeStore();
                    setSync('ok');
                }, function() {
                    setSync('err')
                });
            }

            function adopt(rd, rt) {
                S = {
                    period: rd.period.slice().sort(function(a, b) {
                        return a - b
                    }),
                    log: rd.log || {},
                    cycleLen: rd.cycleLen || 28,
                    periodLen: rd.periodLen || 5,
                    demo: false,
                    updatedAt: rt,
                    syncUser: user.id
                };
                writeStore();
                setSync('ok');
                renderAll();
            }

            function mergeInto(rd, rt) {
                var per = Array.from(new Set(S.period.concat(rd.period))).sort(function(a, b) {
                        return a - b
                    }),
                    log = {};
                [rd.log || {}, S.log].forEach(function(src) {
                    Object.keys(src).forEach(function(k) {
                        var e = log[k] || (log[k] = {
                                mood: [],
                                sym: [],
                                flow: ''
                            }),
                            x = src[k];
                        (x.mood || []).forEach(function(v) {
                            if (e.mood.indexOf(v) < 0) e.mood.push(v)
                        });
                        (x.sym || []).forEach(function(v) {
                            if (e.sym.indexOf(v) < 0) e.sym.push(v)
                        });
                        if (x.flow) e.flow = x.flow;
                    });
                });
                var localNewer = (S.updatedAt || 0) > rt;
                S = {
                    period: per,
                    log: log,
                    cycleLen: localNewer ? S.cycleLen : (rd.cycleLen || S.cycleLen),
                    periodLen: localNewer ? S.periodLen : (rd.periodLen || S.periodLen),
                    demo: false,
                    updatedAt: Date.now(),
                    syncUser: user.id
                };
                writeStore();
                renderAll();
                return push();
            }

            function pull() {
                if (!sb || !user) return Promise.resolve();
                setSync('pulling');
                return sb.from('cycle_data').select('data,updated_at').eq('user_id', user.id).maybeSingle().then(function(r) {
                    if (r.error) {
                        setSync('err');
                        return
                    }
                    var rd = r.data && r.data.data,
                        rt = r.data ? Date.parse(r.data.updated_at) : 0,
                        hasRemote = !!(rd && Array.isArray(rd.period));
                    if (S.syncUser && S.syncUser !== user.id) {
                        S = emptyState();
                        writeStore();
                        renderAll()
                    }
                    if (!hasRemote) {
                        if (hasData()) return push();
                        setSync('ok');
                        return
                    }
                    if (S.demo || (!hasData() && S.syncUser !== user.id)) {
                        adopt(rd, rt);
                        return
                    }
                    if (S.syncUser !== user.id) return mergeInto(rd, rt);
                    var lt = S.updatedAt || 0;
                    if (rt > lt) adopt(rd, rt);
                    else if (lt > rt) return push();
                    else setSync('ok');
                }, function() {
                    setSync('err')
                });
            }
            if (sb) {
                $('#acct-btn').hidden = false;
                sb.auth.onAuthStateChange(function(ev, session) {
                    var u = session ? session.user : null;
                    setTimeout(function() {
                        if (u && (!user || user.id !== u.id)) {
                            user = u;
                            pull().then(function() {
                                if (ev === 'SIGNED_IN') toast('Signed in');
                                refreshSheet();
                                renderAll()
                            });
                        } else if (!u) {
                            user = null;
                            setSync('off')
                        }
                    }, 0);
                });
                document.addEventListener('visibilitychange', function() {
                    if (!document.hidden && user && !pending) pull()
                });
            }

            renderAll();
        })();
    </script>

</body>

</html></html>
